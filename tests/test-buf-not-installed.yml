name: Test action fails gracefully when buf is not installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Remove buf from all known locations so the action cannot find it.
      - name: Ensure buf is absent
        run: |
          # Remove buf from all standard locations
          for loc in /usr/local/bin/buf /usr/bin/buf /bin/buf /home/runner/.local/bin/buf /opt/hostedtoolcache/buf; do
            if [ -e "$loc" ]; then
              sudo rm -rf "$loc"
              echo "Removed buf from $loc"
            fi
          done
          # Remove from any remaining PATH location
          while BUF_PATH="$(command -v buf 2>/dev/null)"; do
            [ -z "$BUF_PATH" ] && break
            sudo rm -f "$BUF_PATH"
            echo "Removed buf from $BUF_PATH"
          done
          if command -v buf > /dev/null 2>&1; then
            echo "WARNING: buf still found at $(command -v buf), replacing with non-executable"
            sudo mv "$(command -v buf)" "$(command -v buf).bak"
          fi
          echo "buf removal complete"

      - id: lint
        uses: .
        with:
          input: tests/fixtures/valid-proto
        continue-on-error: true

      - name: Assert action failed gracefully without buf
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when buf is not installed, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully when buf was not installed"
